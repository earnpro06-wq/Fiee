<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Fake Comment Injector</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 95%; max-width: 900px; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #58a6ff; }
        .stats { background: #21262d; padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #58a6ff; font-weight: bold; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #8b949e; }
        textarea { width: 100%; height: 150px; background: #0d1117; color: #7ee787; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-family: monospace; resize: vertical; box-sizing: border-box; }
        .input-group { display: flex; gap: 10px; align-items: center; margin: 20px 0; }
        input[type="number"] { background: #0d1117; color: white; border: 1px solid #30363d; padding: 10px; border-radius: 6px; width: 100px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; min-width: 150px; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .gen-btn { background: #238636; color: white; }
        .copy-btn { background: #30363d; color: white; border: 1px solid #444c56; }
        .down-btn { background: #1f6feb; color: white; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌀 Ultimate Chaos Injector</h2>
        
        <div class="stats">
            আপনার আসল কোড: <span id="lineCount">0</span> লাইন।
        </div>

        <label>আপনার আসল কোড এখানে দিন:</label>
        <textarea id="inputCode" oninput="updateLineCount()" placeholder="HTML/CSS/JS কোড এখানে পেস্ট করুন..."></textarea>

        <div class="input-group">
            <label>আপনি কত লাইন ফেক কমেন্ট চান?</label>
            <input type="number" id="fakeLines" value="500" min="1">
        </div>

        <div class="btn-group">
            <button class="gen-btn" onclick="generateChaos()">কনফার্ম করুন (Generate)</button>
        </div>

        <label>সুরক্ষিত আউটপুট কোড:</label>
        <textarea id="outputCode" readonly placeholder="Output will appear here..."></textarea>
        
        <div class="btn-group" style="margin-top: 20px;">
            <button class="copy-btn" onclick="copyCode()">কপি করুন</button>
            <button class="down-btn" onclick="downloadCode()">ফাইল ডাউনলোড করুন</button>
        </div>
    </div>

    <script>
        function updateLineCount() {
            const text = document.getElementById('inputCode').value;
            const lines = text ? text.split('\n').length : 0;
            document.getElementById('lineCount').innerText = lines;
        }

        function getRandomChaos() {
            const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
            let str = "";
            for(let i=0; i<20; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
            return str;
        }

        function generateChaos() {
            const realCode = document.getElementById('inputCode').value;
            const numLines = parseInt(document.getElementById('fakeLines').value);

            if (!realCode) {
                alert("আগে আসল কোডটি দিন!");
                return;
            }

            let startJunk = "\n";
            let endJunk = "\n";

            for (let i = 0; i < numLines / 2; i++) {
                startJunk += `\n`;
                endJunk += `\n`;
            }

            const finalResult = `${startJunk}\n\n${realCode}\n\n${endJunk}`;
            document.getElementById('outputCode').value = finalResult;
            alert("সফলভাবে কোড জেনারেট করা হয়েছে!");
        }

        function copyCode() {
            const output = document.getElementById('outputCode');
            if(!output.value) return alert("কোনো কোড নেই!");
            output.select();
            document.execCommand('copy');
            alert("কোড কপি করা হয়েছে!");
        }

        function downloadCode() {
            const code = document.getElementById('outputCode').value;
            if(!code) return alert("ডাউনলোড করার জন্য কোনো কোড নেই!");
            
            const blob = new Blob([code], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "secure_index.html";
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
