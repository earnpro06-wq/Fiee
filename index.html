<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #0b1120;
            max-width: 500px;
            margin: 0 auto;
            color: #fff;
            position: relative;
        }

        /* Edit Profile Modal */
        #edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
        }

        /* Verify OTP Modal */
        #verify-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
        }

        /* Add New Number Modal */
        #add-number-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10001;
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 90%;
            max-width: 400px;
            height: 480px; 
            background: #111827;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
            border: 1px solid #1e293b;
        }

        /* Verify & Add Number Modal Specific Size */
        #verify-modal .modal-content, #add-number-modal .modal-content {
            width: 85%;
            max-width: 340px;
            height: 380px;
        }

        #edit-iframe, #verify-iframe, #add-number-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .banner {
            background: linear-gradient(45deg, #1a1a4d, #000);
            height: 120px;
            position: relative;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #334155;
        }

        .profile-pic {
            width: 85px;
            height: 85px;
            background-color: #1f2937;
            border-radius: 50%;
            border: 3px solid #ff6600;
            position: absolute;
            bottom: -40px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff6600"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
        }

        .content-area {
            background-color: #0b1120;
            margin-top: 50px;
            padding: 20px;
        }

        .edit-profile {
            text-align: right;
            color: #ff6600;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .info-row {
            border-bottom: 1px solid #1e293b;
            padding: 15px 0;
        }

        .label {
            color: #94a3b8;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .value {
            color: #ffcc00;
            font-size: 16px;
            font-weight: 500;
        }

        .phone-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .verify-btn {
            color: #ff6600;
            text-decoration: none;
            font-size: 12px;
            background: rgba(255, 102, 0, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ff6600;
            cursor: pointer;
        }

        .add-btn {
            background-color: #1a1a4d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 15px;
            font-weight: bold;
            width: auto;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            cursor: pointer;
        }

        .footer-info {
            background-color: #111827;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            font-size: 12px;
            border-top: 1px solid #1e293b;
        }

        .footer-info strong {
            color: #ffcc00;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body id="main-body">

    <div id="edit-modal">
        <div class="modal-content">
            <iframe id="edit-iframe" src=""></iframe>
        </div>
    </div>

    <div id="verify-modal">
        <div class="modal-content">
            <iframe id="verify-iframe" src=""></iframe>
        </div>
    </div>

    <div id="add-number-modal">
        <div class="modal-content">
            <iframe id="add-number-iframe" src=""></iframe>
        </div>
    </div>

    <div class="banner">
        <div class="profile-pic"></div>
    </div>

    <div class="content-area">
        <div class="edit-profile" onclick="openEditModal()">Edit Profile</div>
        
        <div class="info-row">
            <div class="label">Username</div>
            <div class="value">017348922562</div>
        </div>

        <div class="info-row">
            <div class="label">Phone Number</div>
            <div class="phone-container">
                <span class="value">+880 ******6615</span>
                <span class="verify-btn" onclick="openVerifyModal()">Verify OTP ⚠️</span>
            </div>
            <button class="add-btn" onclick="openAddNumberModal()">ADD SECONDARY NUMBER</button>
        </div>

        <div class="info-row">
            <div class="label">Email</div>
            <div class="value">Not Set</div>
        </div>

        <div class="info-row">
            <div class="label">Date of birth</div>
            <div class="value">01/01/1990</div>
        </div>

        <div class="info-row">
            <div class="label">Currency</div>
            <div class="value">BDT</div>
        </div>
    </div>

    <div class="footer-info">
        <div>
            <strong>Payment Methods</strong>
            <span style="font-size: 20px;">💳 📱 🏦</span>
        </div>
        <div>
            <strong>Customer Support</strong>
            <span style="color: #fff;">🎧 Chat Now</span>
        </div>
    </div>

    <script>
        function openEditModal() {
            const modal = document.getElementById('edit-modal');
            const iframe = document.getElementById('edit-iframe');
            iframe.src = "edit-profile.html"; 
            modal.style.display = "flex"; 
            document.body.style.overflow = "hidden";
            document.body.style.touchAction = "none";
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            const iframe = document.getElementById('edit-iframe');
            modal.style.display = "none";
            iframe.src = ""; 
            document.body.style.overflow = "auto";
            document.body.style.touchAction = "auto";
        }

        function openVerifyModal() {
            const modal = document.getElementById('verify-modal');
            const iframe = document.getElementById('verify-iframe');
            iframe.src = "verify.html"; 
            modal.style.display = "flex"; 
            document.body.style.overflow = "hidden";
            document.body.style.touchAction = "none";
        }

        function closeVerifyModal() {
            const modal = document.getElementById('verify-modal');
            const iframe = document.getElementById('verify-iframe');
            modal.style.display = "none";
            iframe.src = ""; 
            document.body.style.overflow = "auto";
            document.body.style.touchAction = "auto";
        }

        function openAddNumberModal() {
            const modal = document.getElementById('add-number-modal');
            const iframe = document.getElementById('add-number-iframe');
            iframe.src = "new-number.html"; 
            modal.style.display = "flex"; 
            document.body.style.overflow = "hidden";
            document.body.style.touchAction = "none";
        }

        function closeAddNumberModal() {
            const modal = document.getElementById('add-number-modal');
            const iframe = document.getElementById('add-number-iframe');
            modal.style.display = "none";
            iframe.src = ""; 
            document.body.style.overflow = "auto";
            document.body.style.touchAction = "auto";
        }

        window.onclick = function(event) {
            const editModal = document.getElementById('edit-modal');
            const verifyModal = document.getElementById('verify-modal');
            const addNumberModal = document.getElementById('add-number-modal');
            
            if (event.target == editModal) {
                closeEditModal();
            }
            if (event.target == verifyModal) {
                closeVerifyModal();
            }
            if (event.target == addNumberModal) {
                closeAddNumberModal();
            }
        }
    </script>

</body>
</html>
